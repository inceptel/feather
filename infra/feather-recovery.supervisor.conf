; Optional independent recovery chat. Nothing installs or enables this program.
; Customize paths/user and provision the account, workspace, pinned runtime,
; OMP credentials and private state directory before explicitly starting it.
; Required ENV_ substitutions come from the supervisord daemon's environment,
; not the shell running supervisorctl. See docs/runbooks/refeather.md.
; Never point these pins at Feather's normal current link.

[program:feather-recovery]
command=/usr/bin/node /opt/feather-recovery/pinned/recovery/server.mjs
directory=/srv/recovery-workspace
user=feather-recovery
environment=HOME="/var/lib/feather-recovery",PATH="/usr/local/bin:/usr/bin:/bin",RECOVERY_OMP_BIN="/opt/omp-recovery/pinned/omp",RECOVERY_CWD="/srv/recovery-workspace",RECOVERY_STATE_DIR="/var/lib/feather-recovery/state",RECOVERY_ORIGIN="%(ENV_RECOVERY_ORIGIN)s",RECOVERY_USER="%(ENV_RECOVERY_USER)s",RECOVERY_MODEL="%(ENV_RECOVERY_MODEL)s",RECOVERY_THINKING="%(ENV_RECOVERY_THINKING)s",RECOVERY_PORT="4881"
autostart=false
autorestart=unexpected
exitcodes=0
startsecs=3
stdout_logfile=/var/log/supervisor/feather-recovery.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
