[program:x-bookmark-dispatcher]
command=/home/user/.local/share/feather/current/bin/x-bookmark-dispatcher --loop
directory=/home/user/.local/share/feather/current
environment=HOME="/home/user",PATH="/home/user/.local/bin:/usr/local/bin:/usr/bin:/bin",X_BOOKMARK_INTERVAL_MS="900000"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/home/user/.local/state/feather/x-bookmarks.log
stderr_logfile=/home/user/.local/state/feather/x-bookmarks.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
