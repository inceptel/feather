; Feather — supervisord config
; Copy to /etc/supervisor/conf.d/ and reload:
;   sudo cp feather.supervisor.conf /etc/supervisor/conf.d/feather.conf
;   supervisorctl reread && supervisorctl update
;
; Commands:
; This template deliberately points at one stable release link. Customize the
; program name, paths, user home, state root, and port for the instance. Pass
; the same program/socket/health URL explicitly to bin/refeather promote.

[program:omp-auth-broker]
command=/home/user/.local/bin/omp auth-broker serve --bind=127.0.0.1:8765
directory=/home/user
environment=HOME="/home/user",PATH="/home/user/.local/bin:/usr/local/bin:/usr/bin:/bin"
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/tmp/omp-auth-broker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_redirect=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true

[program:omp-auth-gateway]
command=/home/user/.local/bin/omp auth-gateway serve --bind=127.0.0.1:4000
directory=/home/user
environment=HOME="/home/user",OMP_AUTH_BROKER_URL="http://127.0.0.1:8765",PATH="/home/user/.local/bin:/usr/local/bin:/usr/bin:/bin"
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/tmp/omp-auth-gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_redirect=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true

[program:feather]
command=/opt/feather/current/run.sh
directory=/opt/feather/current
environment=PORT="4870",HOME="/home/user",FEATHER_STATE_DIR="/var/lib/feather/state",FEATHER_OMP_AUTH_GATEWAY_URL="http://127.0.0.1:4000",PATH="/home/user/.local/bin:/usr/local/bin:/usr/bin:/bin"
priority=30
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/tmp/feather.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_redirect=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
